version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_audit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_audit
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: audit_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_admin -d enterprise_audit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
